apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root123
            - name: MYSQL_DATABASE
              value: auth_db
          ports:
            - containerPort: 3306