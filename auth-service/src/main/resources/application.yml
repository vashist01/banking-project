management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.banking: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.cache: TRACE
    org.hibernate.SQL: TRACE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html