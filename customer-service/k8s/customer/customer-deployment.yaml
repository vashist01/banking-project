# ============================================================
# 1. API VERSION
# ============================================================
# Deployment Kubernetes ke apps/v1 API ke through create hoga.
apiVersion: apps/v1


# ============================================================
# 2. RESOURCE TYPE
# ============================================================
# Hum yahan Kubernetes Deployment create kar rahe hain.
#
# Deployment ka kaam:
# - Customer Service ke Pods create karna
# - Pods ko desired number mein maintain karna
# - Pod crash hone par new Pod create karna
# - New version deploy karte waqt Rolling Update karna
kind: Deployment


# ============================================================
# 3. METADATA
# ============================================================
metadata:

  # Deployment ka naam
  # Kubernetes mein hum ise "customer-service" naam se identify karenge.
  name: customer-service

  # Ye Deployment banking namespace ke andar create hoga.
  namespace: banking


# ============================================================
# 4. SPEC
# ============================================================
# spec mein hum batate hain ki Deployment ka desired state kya hai.
spec:

  # ----------------------------------------------------------
  # REPLICAS
  # ----------------------------------------------------------
  # Customer Service ke 2 Pods normally running rahenge.
  #
  # Example:
  #
  # customer-service-pod-1  --> Running
  # customer-service-pod-2  --> Running
  #
  # Agar ek Pod crash ho gaya:
  #
  # pod-1 --> Failed
  # pod-2 --> Running
  # pod-3 --> Kubernetes automatically create karega
  #
  # Production mein 2+ replicas availability improve karte hain.
  replicas: 2


  # ----------------------------------------------------------
  # DEPLOYMENT STRATEGY
  # ----------------------------------------------------------
  strategy:

    # RollingUpdate ka matlab:
    #
    # New version ko gradually deploy karo.
    #
    # Saare old Pods ko ek saath delete nahi kiya jayega.
    type: RollingUpdate

    rollingUpdate:

      # maxUnavailable: 0
      #
      # Update ke time existing available Pods mein se
      # 0 Pods unavailable hone chahiye.
      #
      # Iska goal downtime ko minimize karna hai.
      maxUnavailable: 0

      # maxSurge: 1
      #
      # Update ke time desired replicas ke upar
      # maximum 1 extra Pod create kiya ja sakta hai.
      #
      # Example:
      #
      # Current:
      # customer-v1
      # customer-v1
      #
      # New deployment:
      # customer-v1
      # customer-v1
      # customer-v2   <-- extra Pod
      #
      # customer-v2 ready hone ke baad old Pod remove hoga.
      maxSurge: 1


  # ==========================================================
  # 5. SELECTOR
  # ==========================================================
  # Deployment ko batana hai ki kaunse Pods is Deployment ke hain.
  selector:

    matchLabels:

      # Deployment un Pods ko manage karega
      # jinke paas app=customer-service label hai.
      app: customer-service


  # ==========================================================
  # 6. POD TEMPLATE
  # ==========================================================
  # template batata hai ki Deployment jo Pods create karega
  # unke andar kya configuration hogi.
  template:

    metadata:

      # Pod ke labels.
      #
      # Ye label upar ke selector se match hona zaroori hai.
      labels:
        app: customer-service


    # ========================================================
    # 7. POD SPECIFICATION
    # ========================================================
    spec:

      # ------------------------------------------------------
      # CONTAINERS
      # ------------------------------------------------------
      # Pod ke andar containers define karte hain.
      containers:

        - name: customer-service

          # --------------------------------------------------
          # DOCKER IMAGE
          # --------------------------------------------------
          # Docker Hub se Customer Service ki image use hogi.
          #
          # Example:
          # rajvi1023/customer-service:1.0.0
          #
          # "1.0.0" image ka tag/version hai.
          image: ${FULL_IMAGE}


          # --------------------------------------------------
          # IMAGE PULL POLICY
          # --------------------------------------------------
          # Kubernetes decide karega ki image kab Docker registry
          # se pull karni hai.
          #
          # IfNotPresent:
          # Agar image Node par already available hai,
          # to Kubernetes registry se dobara pull nahi karega.
          imagePullPolicy: Always


          # --------------------------------------------------
          # CONTAINER PORT
          # --------------------------------------------------
          ports:

            - name: http

              # Customer Spring Boot application
              # container ke andar port 8082 par chalegi.
              #
              # IMPORTANT:
              # Humne "name: http" diya hai.
              #
              # Isliye neeche readinessProbe mein:
              #
              # port: http
              #
              # use kar sakte hain.
              containerPort: 8082


          # ==================================================
          # 8. CONFIGMAP
          # ==================================================
          # ConfigMap se non-sensitive configuration
          # container ke environment variables mein aayegi.
          #
          # Example:
          # SPRING_PROFILES_ACTIVE
          # DB_HOST
          # DB_PORT
          # etc.
          #
          # ConfigMap mein password nahi rakhna chahiye.
          envFrom:

            - configMapRef:

                # Kubernetes banking namespace mein
                # "customer-config" naam ka ConfigMap dhundhega.
                name: customer-config


          # ==================================================
          # 9. ENVIRONMENT VARIABLES
          # ==================================================
          # Yahan sensitive DB credentials aur DB URL
          # application ko provide kar rahe hain.
          env:


            # ------------------------------------------------
            # DATABASE USERNAME
            # ------------------------------------------------
            - name: SPRING_DATASOURCE_USERNAME

              valueFrom:

                # Username Kubernetes Secret se liya jayega.
                secretKeyRef:

                  # Secret ka naam
                  name: customer-db-secret

                  # Secret ke andar ye key honi chahiye:
                  #
                  # POSTGRES_USER
                  key: POSTGRES_USER


            # ------------------------------------------------
            # DATABASE PASSWORD
            # ------------------------------------------------
            - name: SPRING_DATASOURCE_PASSWORD

              valueFrom:

                secretKeyRef:

                  # Password bhi same Kubernetes Secret se.
                  name: customer-db-secret

                  # Secret ke andar:
                  #
                  # POSTGRES_PASSWORD
                  key: POSTGRES_PASSWORD


            # ------------------------------------------------
            # DATABASE URL
            # ------------------------------------------------
            - name: SPRING_DATASOURCE_URL

              # PostgreSQL Kubernetes Service ka naam:
              #
              # postgres
              #
              # Port:
              # 5432
              #
              # Database:
              # customer_db
              #
              # Isliye:
              #
              # jdbc:postgresql://postgres:5432/customer_db
              value: jdbc:postgresql://postgres:5432/customer_db


          # ==================================================
          # 10. RESOURCE REQUESTS AND LIMITS
          # ==================================================
          resources:

            # ------------------------------------------------
            # REQUESTS
            # ------------------------------------------------
            # Kubernetes ko batata hai ki Pod ko minimum
            # kitne resources chahiye.
            requests:

              # 250m = 0.25 CPU core
              cpu: "250m"

              # Minimum requested memory = 512 MB
              memory: "512Mi"


            # ------------------------------------------------
            # LIMITS
            # ------------------------------------------------
            # Container maximum itne resources consume kar
            # sakta hai.
            limits:

              # Maximum 1 CPU core
              cpu: "1"

              # Maximum 1 GiB memory
              memory: "1Gi"


          # ==================================================
          # 11. READINESS PROBE
          # ==================================================
          # Readiness ka simple meaning:
          #
          # "Kya Customer Service abhi traffic receive
          # karne ke liye ready hai?"
          #
          # Agar application start ho rahi hai:
          #
          # Pod Running
          #      |
          #      v
          # Application not ready
          #      |
          #      v
          # Service traffic nahi bhejega
          #
          # Application ready hone ke baad:
          #
          # Pod Ready
          #      |
          #      v
          # Service traffic bhejega.
          readinessProbe:

            httpGet:

              # Spring Boot Actuator ka readiness endpoint.
              path: /actuator/health/readiness

              # IMPORTANT:
              # Humne container port ko name "http" diya hai,
              # isliye yahan "http" use kar sakte hain.
              port: http


            # Application start hone ke baad
            # pehli readiness check 30 seconds baad hogi.
            initialDelaySeconds: 30

            # Har 10 seconds mein check karega.
            periodSeconds: 10

            # Response ke liye maximum 5 seconds wait karega.
            timeoutSeconds: 5

            # 3 consecutive failures ke baad
            # Pod ko NotReady mark karega.
            failureThreshold: 3


          # ==================================================
          # 12. LIVENESS PROBE
          # ==================================================
          # Liveness ka meaning:
          #
          # "Kya application properly alive hai?"
          #
          # Agar application hang/crash ho jaye,
          # Kubernetes container ko restart kar sakta hai.
          livenessProbe:

            httpGet:

              # Spring Boot Actuator liveness endpoint.
              path: /actuator/health/liveness

              # Named container port.
              port: http


            # Application ko initially 60 seconds ka time do.
            # Uske baad liveness check start hoga.
            initialDelaySeconds: 60

            # Har 20 seconds mein check.
            periodSeconds: 20

            # Maximum 5 seconds response ke liye wait.
            timeoutSeconds: 5

            # 3 failures ke baad Kubernetes action lega.
            failureThreshold: 3


          # ==================================================
          # 13. SECURITY CONTEXT
          # ==================================================
          # Container ko unnecessarily high privileges se
          # bachane ke liye security settings.
          securityContext:

            # Container ko additional Linux privileges
            # lene se rokta hai.
            allowPrivilegeEscalation: false

            # Container root user ke roop mein run nahi hona chahiye.
            #
            # SECURITY BEST PRACTICE
            runAsNonRoot: true


      # ======================================================
      # 14. TERMINATION GRACE PERIOD
      # ======================================================
      # Jab Kubernetes Pod ko stop karega,
      # application ko gracefully shutdown hone ke liye
      # 30 seconds milenge.
      #
      # Example:
      #
      # Kubernetes:
      # "Pod ko terminate karo"
      #
      # Application:
      # "Existing request complete karta hoon..."
      #
      # 30 seconds tak graceful shutdown ka chance.
      terminationGracePeriodSeconds: 30