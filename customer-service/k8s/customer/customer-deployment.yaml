# ============================================================
# 1. API VERSION
# ============================================================

# Deployment Kubernetes ke apps/v1 API ke through create hoga.
apiVersion: apps/v1


# ============================================================
# 2. RESOURCE TYPE
# ============================================================

# Hum yahan Kubernetes Deployment create kar rahe hain.
#
# Deployment ka kaam:
# - Customer Service ke Pods create karna
# - Pods ko desired number mein maintain karna
# - Pod crash hone par new Pod create karna
# - New version deploy karte waqt Rolling Update karna
kind: Deployment


# ============================================================
# 3. METADATA
# ============================================================

metadata:

  # Deployment ka naam
  # Kubernetes mein hum ise "customer-service" naam se identify karenge.
  name: customer-service

  # Ye Deployment banking namespace ke andar create hoga.
  namespace: banking


# ============================================================
# 4. SPEC
# ============================================================

# spec mein hum batate hain ki Deployment ka desired state kya hai.
spec:

  # ----------------------------------------------------------
  # REPLICAS
  # ----------------------------------------------------------

  # Customer Service ke 2 Pods normally running rahenge.
  #
  # Production mein 2+ replicas availability improve karte hain.
  replicas: 2


  # ----------------------------------------------------------
  # DEPLOYMENT STRATEGY
  # ----------------------------------------------------------

  strategy:

    # New version ko gradually deploy karo.
    type: RollingUpdate

    rollingUpdate:

      # Update ke time existing available Pods mein se
      # 0 Pods unavailable hone chahiye.
      #
      # Isse downtime minimize hota hai.
      maxUnavailable: 0

      # Update ke time desired replicas ke upar
      # maximum 1 extra Pod create kiya ja sakta hai.
      maxSurge: 1


  # ==========================================================
  # 5. SELECTOR
  # ==========================================================

  # Deployment ko batana hai ki kaunse Pods is Deployment ke hain.
  selector:

    matchLabels:

      # Deployment un Pods ko manage karega
      # jinke paas app=customer-service label hai.
      app: customer-service


  # ==========================================================
  # 6. POD TEMPLATE
  # ==========================================================

  template:

    metadata:

      # Pod ke labels.
      #
      # Ye label upar ke selector se match hona zaroori hai.
      labels:
        app: customer-service


    # ========================================================
    # 7. POD SPECIFICATION
    # ========================================================

    spec:

      # ========================================================
      # POD SECURITY CONTEXT
      # ========================================================
      #
      # Pod root user ke roop mein run nahi hoga.
      #
      # UID/GID 1001 Dockerfile ke non-root user se match
      # hona chahiye.
      #
      # Dockerfile mein:
      #
      # RUN useradd --system --uid 1001 customeruser
      # USER customeruser
      #
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001


      # ========================================================
      # CONTAINERS
      # ========================================================

      containers:

        - name: customer-service

          # --------------------------------------------------
          # DOCKER IMAGE
          # --------------------------------------------------

          # Jenkins ${FULL_IMAGE} ko actual image tag se replace karega.
          #
          # Example:
          # rajvi1023/customer-service:25
          image: ${FULL_IMAGE}

          # Har deployment par registry se latest specified
          # image tag pull karne ki koshish karega.
          imagePullPolicy: Always


          # --------------------------------------------------
          # CONTAINER SECURITY
          # --------------------------------------------------

          # Container ko root ke roop mein run nahi karna.
          securityContext:

            # Root user ko prevent karta hai.
            runAsNonRoot: true

            # Dockerfile ke customeruser ka UID.
            runAsUser: 1001

            # Container ko additional privileges gain karne
            # se prevent karta hai.
            allowPrivilegeEscalation: false


          # --------------------------------------------------
          # CONTAINER PORT
          # --------------------------------------------------

          ports:

            - name: http

              # Customer Spring Boot application
              # container ke andar port 8082 par chalegi.
              containerPort: 8082


          # ==================================================
          # 8. CONFIGMAP
          # ==================================================

          # ConfigMap se non-sensitive configuration
          # environment variables ke roop mein aayegi.
          #
          # Password yahan nahi rakhna chahiye.
          envFrom:

            - configMapRef:

                # Kubernetes banking namespace mein
                # "customer-config" naam ka ConfigMap dhundhega.
                name: customer-config


          # ==================================================
          # 9. DATABASE ENVIRONMENT VARIABLES
          # ==================================================

          env:

            # ------------------------------------------------
            # DATABASE USERNAME
            # ------------------------------------------------

            - name: SPRING_DATASOURCE_USERNAME

              valueFrom:

                secretKeyRef:

                  # PostgreSQL ka shared Secret.
                  name: postgres-secret

                  # Secret ke andar username ki key.
                  key: POSTGRES_USER


            # ------------------------------------------------
            # DATABASE PASSWORD
            # ------------------------------------------------

            - name: SPRING_DATASOURCE_PASSWORD

              valueFrom:

                secretKeyRef:

                  # PostgreSQL ka shared Secret.
                  name: postgres-secret

                  # Secret ke andar password ki key.
                  key: POSTGRES_PASSWORD


            # ------------------------------------------------
            # DATABASE URL
            # ------------------------------------------------

            - name: SPRING_DATASOURCE_URL

              # PostgreSQL Kubernetes Service ka naam:
              # postgres
              #
              # Port:
              # 5432
              #
              # Database:
              # customer_db
              #
              # Kubernetes cluster ke andar:
              # postgres -> PostgreSQL Service
              value: jdbc:postgresql://postgres:5432/customer_db


          # ==================================================
          # 10. RESOURCE REQUESTS AND LIMITS
          # ==================================================

          resources:

            # ------------------------------------------------
            # REQUESTS
            # ------------------------------------------------

            # Kubernetes ko batata hai ki Pod ko minimum
            # kitne resources chahiye.
            requests:

              # 250m = 0.25 CPU core
              cpu: "250m"

              # Minimum requested memory = 512 MiB
              memory: "512Mi"


            # ------------------------------------------------
            # LIMITS
            # ------------------------------------------------

            # Container maximum itne resources consume
            # kar sakta hai.
            limits:

              # Maximum 1 CPU core
              cpu: "1"

              # Maximum 1 GiB memory
              memory: "1Gi"


          # ==================================================
          # 11. READINESS PROBE
          # ==================================================

          # Readiness ka meaning:
          #
          # "Kya Customer Service traffic receive karne
          # ke liye ready hai?"
          #
          # Agar application ready nahi hai:
          # Service traffic nahi bhejega.
          readinessProbe:

            httpGet:

              # Spring Boot Actuator readiness endpoint.
              path: /actuator/health/readiness

              # Named container port.
              port: 8082
              scheme: HTTPS

            # Application start hone ke baad
            # pehli readiness check 30 seconds baad hogi.
            initialDelaySeconds: 30

            # Har 10 seconds mein check karega.
            periodSeconds: 10

            # Response ke liye maximum 5 seconds wait karega.
            timeoutSeconds: 5

            # 3 consecutive failures ke baad
            # Pod ko NotReady mark karega.
            failureThreshold: 3


          # ==================================================
          # 12. LIVENESS PROBE
          # ==================================================

          # Liveness ka meaning:
          #
          # "Kya application properly alive hai?"
          #
          # Agar application hang/crash ho jaye,
          # Kubernetes container restart kar sakta hai.
          livenessProbe:

            httpGet:

              # Spring Boot Actuator liveness endpoint.
              path: /actuator/health/liveness

              # Named container port.
              port: 8082
              scheme: HTTPS


            # Application ko initially 60 seconds ka time do.
            initialDelaySeconds: 60

            # Har 20 seconds mein check.
            periodSeconds: 20

            # Maximum 5 seconds response ke liye wait.
            timeoutSeconds: 5

            # 3 failures ke baad Kubernetes action lega.
            failureThreshold: 3


      # ======================================================
      # 13. TERMINATION GRACE PERIOD
      # ======================================================

      # Jab Kubernetes Pod ko stop karega,
      # application ko gracefully shutdown hone ke liye
      # 30 seconds milenge.
      #
      # Existing requests complete karne ka chance milega.
      terminationGracePeriodSeconds: 30
