# ============================================================
# CUSTOMER SERVICE DEPLOYMENT
# ============================================================

apiVersion: apps/v1

kind: Deployment

metadata:
  name: customer-service
  namespace: banking

spec:

  # ==========================================================
  # REPLICAS
  # ==========================================================

  replicas: 2


  # ==========================================================
  # DEPLOYMENT STRATEGY
  # ==========================================================

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1


  # ==========================================================
  # SELECTOR
  # ==========================================================

  selector:
    matchLabels:
      app: customer-service


  # ==========================================================
  # POD TEMPLATE
  # ==========================================================

  template:

    metadata:
      labels:
        app: customer-service


    # ========================================================
    # POD SPEC
    # ========================================================

    spec:

      # ======================================================
      # POD SECURITY CONTEXT
      # ======================================================

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001


      # ======================================================
      # CONTAINER
      # ======================================================

      containers:

        - name: customer-service

          # ==================================================
          # IMAGE
          # ==================================================

          image: ${FULL_IMAGE}

          imagePullPolicy: Always


          # ==================================================
          # CONTAINER SECURITY
          # ==================================================

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false


          # ==================================================
          # CONTAINER PORTS
          # ==================================================

          ports:

            # Application HTTPS / mTLS
            - name: https
              containerPort: 8082
              protocol: TCP

            # Spring Boot Actuator
            # HTTP - Kubernetes health probes
            - name: management
              containerPort: 8081
              protocol: TCP


          # ==================================================
          # CONFIGMAP
          # ==================================================

          envFrom:

            - configMapRef:
                name: customer-config


          # ==================================================
          # DATABASE ENVIRONMENT VARIABLES
          # ==================================================

          env:

            # PostgreSQL username
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER


            # PostgreSQL password
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD


            # PostgreSQL URL
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/customer_db


          # ==================================================
          # RESOURCES
          # ==================================================

          resources:

            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"


          # ==================================================
          # STARTUP PROBE
          # ==================================================
          #
          # Allows Spring Boot time to start.
          #
          # IMPORTANT:
          # This uses HTTP port 8081.
          # It does NOT use the mTLS port 8082.
          #

          startupProbe:

            httpGet:
              path: /actuator/health
              port: management
              scheme: HTTP

            periodSeconds: 10
            timeoutSeconds: 5

            # 12 failures x 10 seconds = 120 seconds
            # allowed for application startup
            failureThreshold: 12


          # ==================================================
          # READINESS PROBE
          # ==================================================
          #
          # Kubernetes uses this to decide whether the Pod
          # should receive traffic.
          #

          readinessProbe:

            httpGet:
              path: /actuator/health/readiness
              port: management
              scheme: HTTP

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1


          # ==================================================
          # LIVENESS PROBE
          # ==================================================
          #
          # Kubernetes uses this to determine whether the
          # application needs to be restarted.
          #

          livenessProbe:

            httpGet:
              path: /actuator/health/liveness
              port: management
              scheme: HTTP

            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1


      # ======================================================
      # TERMINATION
      # ======================================================

      terminationGracePeriodSeconds: 30