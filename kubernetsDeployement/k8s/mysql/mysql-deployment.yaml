apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: employee

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:

    metadata:
      labels:
        app: mysql

    spec:

      containers:

        - name: mysql

          image: mysql:8.4

          ports:
            - containerPort: 3306

          env:

            - name: MYSQL_DATABASE
              value: employeedb

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password

          volumeMounts:

            - name: mysql-data
              mountPath: /var/lib/mysql

      volumes:

        - name: mysql-data
          emptyDir: {}