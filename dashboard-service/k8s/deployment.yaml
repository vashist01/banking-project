apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard-service

spec:
  replicas: 3

  selector:
    matchLabels:
      app: dashboard-service

  template:
    metadata:
      labels:
        app: dashboard-service

    spec:
      containers:
        - name: dashboard-service
          image: rajvi1023/dashboard-service:15

          ports:
            - containerPort: 8020

          readinessProbe:
            tcpSocket:
              port: 8020
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: 8020
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3